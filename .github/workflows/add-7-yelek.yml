name: Add 7 new yelek products
on:
  push:
    paths-ignore:
      - 'index.html'
permissions:
  contents: write
jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert products
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- MT-7-YELEK-NEW -->'
          if marker not in s:
              products=[
                ('GABARDİN YELEK.png','Gabardin Yelek','Dayanıklı gabardin kumaşıyla iş ortamları için kullanışlı yelek.'),
                ('HARİTACI YELEK.png','Haritacı Yelek','Saha çalışanları için fonksiyonel ve rahat iş yeleği.'),
                ('İÇİ POLAR YELEK.jpg','İçi Polar Yelek','İçi polar yapısıyla sıcak tutan rahat iş yeleği.'),
                ('Jacks YELEK.jpeg','Jacks Yelek','Rahat kesimi ve kullanışlı yapısıyla iş yeleği.'),
                ('MÜHENDİS.webp','Mühendis Yeleği','Saha ve teknik ekipler için tasarlanmış fonksiyonel yelek.'),
                ('POLAR YELEK.jpg','Polar Yelek','Sıcak tutan polar yapısıyla iş ve dış ortam kullanımına uygundur.'),
                ('PUF YELEK.jpg','Puf Yelek','Hafif ve sıcak tutan puf yapısıyla rahat iş yeleği.')
              ]
              cards=[marker]
              for img,title,desc in products:
                  cards.append(f'<article class="product" data-cat="yelek"><div class="product-img"><img src="{img}" alt="{title}"></div><div class="product-body"><span>İŞ YELEĞİ</span><h3>{title}</h3><p>{desc}</p><a href="#iletisim" class="product-link">Teklif iste →</a></div></article>')
              block='\n'.join(cards)+'\n'
              anchor='<!-- MT-YELEK-PRODUCTS -->'
              pos=s.find(anchor)
              if pos==-1:
                  raise SystemExit('Yelek bölümü bulunamadı')
              # Insert after the existing yelek marker; this keeps the new models in the yelek group.
              insert=pos+len(anchor)
              s=s[:insert]+'\n'+block+s[insert:]
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Add 7 new yelek products"
          git push