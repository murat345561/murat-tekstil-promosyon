name: Add site tools

on:
  push:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update index
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # Add Yelek filter once.
          if 'data-filter="yelek"' not in s:
              marker='<button class="filter" data-filter="sapka">Şapka</button>'
              if marker in s:
                  s=s.replace(marker, marker+'<button class="filter" data-filter="yelek">Yelek</button>',1)

          # Add the 11 yelek products once.
          marker='<!-- MT-YELEK-PRODUCTS -->'
          if marker not in s:
              products=[
                ('01-sisme-yelek.jpg','Şişme Yelek','Sıcak tutan yapısı ve rahat kullanımıyla iş ortamları için uygun şişme yelek.'),
                ('2 şık yelek.jpg','Şık İş Yeleği','Şık görünümü ve rahat kesimiyle kurumsal kullanım için uygun iş yeleği.'),
                ('3 gabardin kapitoneli yelek.webp','Gabardin Kapitoneli Yelek','Gabardin kumaş ve kapitone yapısıyla dayanıklı ve kullanışlı iş yeleği.'),
                ('4 softşel yelek.jpg','Softshell Yelek','Rahat ve dayanıklı softshell kumaşıyla saha ve dış ortam kullanımı için uygundur.'),
                ('5 micro elfaflı şişme yelek.webp','Micro Elyaflı Şişme Yelek','Micro elyaf dolgulu yapısıyla sıcak tutan, hafif ve rahat iş yeleği.'),
                ('6 CİFT TARAFLI POLAR YELEK.jpg','Çift Taraflı Polar Yelek','İki farklı kullanım seçeneği sunan sıcak tutan çift taraflı polar yelek.'),
                ('7 çifttaraflı yelek.png','Çift Taraflı Yelek','Pratik kullanımı ve çift taraflı tasarımıyla farklı çalışma ortamlarına uygundur.'),
                ('8 softşel yelek.jpg','Softshell Yelek','Dayanıklı softshell kumaşı ve rahat yapısıyla iş kullanımı için tasarlanmıştır.'),
                ('9 cok ceplı köküklü kapitoneli yelek.webp','Çok Cepli Kapitoneli Yelek','Çok cepli ve kapitoneli tasarımıyla saha çalışanları için fonksiyonel yelek.'),
                ('10 cok ceplı kapitoneli yelek.jpg','Çok Cepli Kapitoneli Yelek','Fonksiyonel cep detayları ve kapitone yapısıyla kullanışlı iş yeleği.'),
                ('11 İŞ-YELEKLERİ.jpg','İş Yelekleri','Farklı sektör ve çalışma koşullarına uygun kurumsal iş yeleği seçenekleri.')
              ]
              cards=['<!-- MT-YELEK-PRODUCTS -->']
              for img,title,desc in products:
                  cards.append(f'<article class="product" data-cat="yelek"><div class="product-img"><img src="{img}" alt="{title}"></div><div class="product-body"><span>İŞ YELEĞİ</span><h3>{title}</h3><p>{desc}</p><a href="#iletisim" class="product-link">Teklif iste →</a></div></article>')
              block='\n'.join(cards)
              pos=s.find('<section id="ozel-uretim"')
              if pos==-1: pos=s.find('<section id="neden"')
              if pos==-1: raise SystemExit('Ürünler bölümünün sonu bulunamadı')
              end=s.rfind('</div></div></section>',0,pos)
              if end==-1: raise SystemExit('Ürün grid kapanışı bulunamadı')
              s=s[:end]+block+s[end:]

          # Keep the existing language/time tools unchanged; this workflow only adds products.
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Add yelek category and 11 yelek products"
          git push